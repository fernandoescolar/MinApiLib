on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

name: CI

jobs:
  pack:
    runs-on: ubuntu-latest
    name: Test MinApiLib
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version:  |
            8.0.x
            9.0.x
            10.0.x
            11.0.x
      - name: Install dependencies
        run: dotnet restore MinApiLib.sln
      - name: Build
        run: dotnet build MinApiLib.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test MinApiLib.sln --configuration Release --no-build --verbosity normal
      - name: Build samples
        run: dotnet build samples/MinApiLib.Samples.sln --configuration Release
